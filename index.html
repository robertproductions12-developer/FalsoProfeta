    <style>
        :root {
            --gold: #e2b04a;
            --gold-dark: #b8860b;
            --bg: #050505;
            --card: rgba(15, 15, 15, 0.98);
            --accent: #ff3e3e;
            --messenger: #0084ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: white;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a150a 0%, #050505 100%);
        }

        /* --- REDES SOCIALES ESTÁTICAS --- */
        .social-bar {
            position: fixed;
            bottom: 20px;
            left: 0; width: 100%;
            display: flex;
            justify-content: center;
            gap: 25px;
            z-index: 5; /* Por detrás de las tarjetas pero visible */
        }
        .social-bar a {
            color: white;
            font-size: 22px;
            opacity: 0.5;
            transition: 0.3s;
            text-decoration: none;
        }
        .social-bar a:hover { opacity: 1; transform: scale(1.2); }
        .fa-youtube:hover { color: #ff0000; }
        .fa-instagram:hover { color: #e1306c; }
        .fa-tiktok:hover { color: #00f2ea; }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .q-mark {
            position: absolute;
            color: var(--gold);
            opacity: 0.05;
            font-weight: 900;
            animation: float 10s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        .top-controls {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 1100;
        }

        .icon-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px;
            border-radius: 50%;
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        #side-panel {
            position: fixed;
            top: 0; right: -300px;
            width: 280px; height: 100%;
            background: var(--card);
            border-left: 1px solid var(--gold);
            z-index: 2000;
            transition: 0.4s;
            padding: 20px;
            overflow-y: auto;
        }
        #side-panel.open { right: 0; }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%; width: 100%;
            padding: 20px;
            text-align: center;
            position: absolute;
            z-index: 10;
        }
        .active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            width: 100%; max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 80vh;
            overflow-y: auto;
        }

        .btn {
            background: linear-gradient(135deg, #333 0%, #000 100%);
            border: 1px solid var(--gold-dark);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin: 6px 0;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-gold { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); color: black; border: none; }
        .btn-chat { border-color: var(--messenger); color: var(--messenger); }
        .btn-exit { border-color: var(--accent); color: var(--accent); }

        input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px; border-radius: 10px;
            color: white; width: 100%; margin-bottom: 10px;
            text-align: center; outline: none;
        }

        .chat-container {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }
        .chat-box {
            height: 25vh;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 5px;
            margin-bottom: 10px;
        }
        .msg {
            font-size: 11px; padding: 6px 10px; border-radius: 8px; text-align: left;
            background: rgba(255,255,255,0.05); border-left: 3px solid var(--gold);
        }
        .msg b { color: var(--gold); display: block; font-size: 9px; }

        .emoji-row {
            display: flex; justify-content: space-around;
            padding: 5px; background: rgba(255,255,255,0.03);
            border-radius: 8px; margin-bottom: 5px;
        }
        .emoji-row span { cursor: pointer; font-size: 18px; transition: 0.2s; }
        .emoji-row span:hover { transform: scale(1.3); }

        footer { position: fixed; bottom: 5px; width: 100%; text-align: center; font-size: 8px; opacity: 0.2; }
    </style>
</head>
<body>

    <div class="bg-animation" id="bg-animation"></div>

    <!-- REDES SOCIALES -->
    <div class="social-bar">

    <div class="top-controls">
        <div class="icon-btn" onclick="toggleMusic()"><i id="music-icon" class="fas fa-volume-mute"></i></div>

        <div class="icon-btn" onclick="toggleSidePanel()"><i class="fas fa-bars"></i></div>
    </div>

    <!-- PANEL LATERAL -->
    <div id="side-panel">
        <div onclick="toggleSidePanel()" style="cursor:pointer; color:var(--gold);"><i class="fas fa-times"></i> CERRAR</div>
        <br>
        <h3 style="color:var(--gold); font-size:12px;">ESTADO DEL TEMPLO</h3>
        <p id="online-count" style="font-size:20px; font-weight:900;">...</p>
        <hr style="opacity:0.1; margin:15px 0;">
        <button class="btn btn-chat" onclick="showScreen('screen-global-chat'); toggleSidePanel();">CHAT LIBRE</button>
        <button class="btn btn-exit" onclick="location.reload()">SALIR</button>
    </div>

    <!-- 1. LOGIN -->
    <div id="screen-login" class="screen active">
        <div class="glass-card">
            <h1 style="color:var(--gold); font-weight:900; letter-spacing: -1px;">FALSO PROFETA</h1>
            <p style="font-size:10px; opacity:0.6; margin-bottom:20px;">EDICIÓN BÍBLICA ONLINE</p>
            <input type="text" id="user-name" placeholder="Escribe tu nombre...">
            <button class="btn btn-gold" onclick="login()">ENTRAR AL TEMPLO</button>
        </div>
    </div>

    <!-- 2. MENU -->
    <div id="screen-menu" class="screen">
        <div class="glass-card">
            <button class="btn btn-gold" onclick="createRoom()">CREAR NUEVA SALA</button>
            <button class="btn" onclick="showScreen('screen-join-room')">UNIRSE A SALA</button>
            <button class="btn btn-chat" onclick="showScreen('screen-global-chat')">CHAT GLOBAL (TODOS)</button>
        </div>
    </div>

    <!-- 3. CHAT GLOBAL -->
    <div id="screen-global-chat" class="screen">
        <div class="glass-card">
            <h3 style="color:var(--gold)">CHAT LIBRE</h3>
            <div class="chat-container">
                <div id="global-chat-box" class="chat-box"></div>
                <div class="emoji-row">
                    <span onclick="addEmoji('g','🙏')">🙏</span><span onclick="addEmoji('g','🔥')">🔥</span>
                    <span onclick="addEmoji('g','📖')">📖</span><span onclick="addEmoji('g','🤫')">🤫</span>
                    <span onclick="addEmoji('g','🙌')">🙌</span>
                </div>
                <input type="text" id="global-chat-input" placeholder="Di algo a todos...">
                <button class="btn btn-gold" onclick="sendGlobalMsg()">ENVIAR</button>
            </div>
            <button class="btn" onclick="backFromGlobal()">VOLVER</button>
        </div>
    </div>

    <!-- 4. LOBBY HOST -->
    <div id="screen-lobby-host" class="screen">
        <div class="glass-card">
            <h2 style="color:var(--gold)">CÓDIGO: <span id="room-code-display">---</span></h2>
            <div id="player-list-host" style="margin:20px 0; font-size:12px; text-align:left;"></div>
            <button class="btn btn-gold" onclick="startGame()">INICIAR PARTIDA</button>
            <button class="btn btn-exit" onclick="deleteRoom()">CERRAR SALA</button>
        </div>
    </div>

    <!-- 5. UNIRSE -->
    <div id="screen-join-room" class="screen">
        <div class="glass-card">
            <input type="text" id="join-code" placeholder="CÓDIGO DE SALA" style="text-transform:uppercase;">
            <button class="btn btn-gold" onclick="joinRoom()">UNIRSE AHORA</button>
            <button class="btn" onclick="showScreen('screen-menu')">VOLVER</button>
        </div>
    </div>

    <!-- 6. LOBBY GUEST -->
    <div id="screen-lobby-guest" class="screen">
        <div class="glass-card">
            <h2 style="color:var(--gold)">ESPERANDO AL GUÍA</h2>
            <div id="player-list-guest" style="margin:20px 0; font-size:12px; text-align:left;"></div>
            <button class="btn btn-exit" onclick="leaveRoom()">ABANDONAR</button>
        </div>
    </div>

    <!-- 7. REVELACIÓN -->
    <div id="screen-reveal" class="screen">
        <div class="glass-card">
            <h2 id="role-name">---</h2>
            <div id="game-word" style="font-size:30px; font-weight:900; color:var(--gold); margin:20px 0;">---</div>
            <p id="game-quote" style="font-style:italic; font-size:12px; opacity:0.8;"></p>
            <button class="btn btn-gold" style="margin-top:20px;" onclick="goToDebate()">ENTENDIDO</button>
        </div>
    </div>

    <!-- 8. DEBATE -->
    <div id="screen-debate" class="screen">
        <div id="timer" style="font-size:30px; color:var(--gold); font-weight:900;">02:00</div>
        <div id="turn-info" style="font-size:12px; margin:10px 0;"></div>
        <div class="chat-container" style="max-width:380px;">
            <div id="debate-chat-box" class="chat-box"></div>
            <div id="clue-input-area" style="display:none;">
                <div class="emoji-row">
                    <span onclick="addEmoji('d','🧐')">🧐</span><span onclick="addEmoji('d','🐍')">🐍</span>
                    <span onclick="addEmoji('d','🛡️')">🛡️</span><span onclick="addEmoji('d','🕯️')">🕯️</span>
                </div>
                <input type="text" id="clue-input" placeholder="Escribe tu pista...">
                <button class="btn btn-gold" onclick="sendClue()">ENVIAR PISTA</button>
            </div>
        </div>
    </div>

    <!-- 9. VOTACIÓN -->
    <div id="screen-vote" class="screen">
        <div class="glass-card">
            <h3 style="color:var(--accent)">¿QUIÉN ES EL FALSO PROFETA?</h3>
            <div id="vote-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;"></div>
        </div>
    </div>

    <!-- 10. RESULTADO -->
    <div id="screen-result" class="screen">
        <div class="glass-card">
            <h2 id="res-title">---</h2>
            <p style="font-size:10px; margin-top:10px;">EL IMPOSTOR ERA:</p>
            <h1 id="res-name" style="color:var(--gold)">---</h1>
            <div id="res-summary" style="margin:15px 0; font-size:10px; text-align:left; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px;"></div>
            
            <div id="host-controls" style="display:none;">
                <button class="btn btn-gold" onclick="resetGame()">NUEVA PARTIDA (GUÍA)</button>
                <button class="btn btn-exit" onclick="deleteRoom()">CERRAR SALA</button>
            </div>
            <div id="guest-controls" style="display:none;">
                <p id="wait-msg" style="font-size:10px; color:var(--gold); margin-bottom:10px;">Esperando al Guía...</p>
                <button class="btn btn-exit" onclick="location.reload()">SALIR DEL TEMPLO</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg"></audio>
    <footer>EL FALSO PROFETA v2.0 - BY ROBERT PARACO</footer>

            {w:"El sembrador", q:"El que oye la palabra"}, {w:"Trigo y cizaña", q:"Dejad crecer juntos"},
            {w:"Grano de mostaza", q:"La más pequeña"}, {w:"La levadura", q:"Leudó toda la masa"},
            {w:"Tesoro escondido", q:"Vende todo lo que tiene"}, {w:"Perla de gran precio", q:"Una perla preciosa"},
            {w:"La red", q:"Separan a los malos"}, {w:"La oveja perdida", q:"Hasta hallarla"},
            {w:"Moneda perdida", q:"Se goza cuando la halla"}, {w:"El hijo pródigo", q:"Estaba muerto y revivió"},
            {w:"Buen samaritano", q:"Tuvo compasión"}, {w:"Amigo importuno", q:"Por su insistencia"},
            {w:"Rico insensato", q:"Vienen por tu alma"}, {w:"Higuera estéril", q:"Dale otra oportunidad"},
            {w:"Los invitados", q:"Muchos son llamados"}, {w:"Los talentos", q:"Bien, buen siervo fiel"},
            {w:"Diez vírgenes", q:"Velad"}, {w:"Juicio final", q:"A uno de estos pequeños"},
            {w:"Fariseo y publicano", q:"Descendió justificado"}, {w:"Constructor sabio", q:"Sobre la roca"}
        ];

        let currentUser = null, currentRoomId = null, isHost = false, timerInt = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function toggleSidePanel() { document.getElementById('side-panel').classList.toggle('open'); }

        function toggleMusic() {
            const m = document.getElementById('bg-music');
            const i = document.getElementById('music-icon');
            if(m.paused) { m.play(); i.className = "fas fa-volume-up"; }
            else { m.pause(); i.className = "fas fa-volume-mute"; }
        }

        function addEmoji(type, emoji) {
            const id = (type === 'g') ? 'global-chat-input' : 'clue-input';
            document.getElementById(id).value += emoji;
        }

        // LOGIN
        async function login() {
            const name = document.getElementById('user-name').value.trim();
            if(!name) return;
            const cred = await auth.signInAnonymously();
            currentUser = { uid: cred.user.uid, name };
            db.collection('presencia').doc(currentUser.uid).set({ name, active: true });
            initGlobalChat();
            showScreen('screen-menu');
        }

        // CHAT GLOBAL
        function initGlobalChat() {
            db.collection('global_chat').orderBy('time','desc').limit(20).onSnapshot(snap => {
                const box = document.getElementById('global-chat-box');
                box.innerHTML = "";
                snap.docs.reverse().forEach(d => {
                    const m = d.data();
                    box.innerHTML += `<div class="msg"><b>${m.name}</b>${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
            db.collection('presencia').onSnapshot(snap => {
                document.getElementById('online-count').innerText = `${snap.size} ALMAS`;
            });
        }

        async function sendGlobalMsg() {
            const input = document.getElementById('global-chat-input');
            if(!input.value) return;
            await db.collection('global_chat').add({ name: currentUser.name, text: input.value, time: Date.now() });
            input.value = "";
        }

        function backFromGlobal() {
            if(currentRoomId) {
                // Si estaba en una sala, volver a la pantalla correspondiente
                db.collection('rooms').doc(currentRoomId).get().then(doc => {
                    const s = doc.data().status;
                    if(s === 'waiting') showScreen(isHost ? 'screen-lobby-host' : 'screen-lobby-guest');
                    else showScreen('screen-debate');
                });
            } else showScreen('screen-menu');
        }

        // SALAS
        async function createRoom() {
            const code = Math.random().toString(36).substring(2,7).toUpperCase();
            currentRoomId = code; isHost = true;
            await db.collection('rooms').doc(code).set({ hostId: currentUser.uid, status: 'waiting', createdAt: Date.now() });
            document.getElementById('room-code-display').innerText = code;
            joinLogic(code);
            showScreen('screen-lobby-host');
        }

        async function joinRoom() {
            const code = document.getElementById('join-code').value.toUpperCase();
            const doc = await db.collection('rooms').doc(code).get();
            if(!doc.exists) return alert("SALA NO EXISTE");
            currentRoomId = code; isHost = false;
            joinLogic(code);
            showScreen('screen-lobby-guest');
        }

        async function joinLogic(code) {
            await db.collection('rooms').doc(code).collection('players').doc(currentUser.uid).set({
                name: currentUser.name, uid: currentUser.uid, joinedAt: Date.now()
            });
            listenRoom(code);
        }

        function listenRoom(code) {
            db.collection('rooms').doc(code).onSnapshot(doc => {
                const data = doc.data();
                if(!data) { if(!isHost) location.reload(); return; }
                if(data.status === 'playing') setupGame(data);
                if(data.status === 'debate') handleDebate(data);
                if(data.status === 'voting') setupVoting();
                if(data.status === 'result') showResult(data);
                if(data.status === 'waiting' && !isHost) showScreen('screen-lobby-guest');
            });

            db.collection('rooms').doc(code).collection('players').onSnapshot(snap => {
                let h = "";
                snap.forEach(p => h += `<div>🔹 ${p.data().name}</div>`);
                document.getElementById('player-list-host').innerHTML = h;
                document.getElementById('player-list-guest').innerHTML = h;
            });

            db.collection('rooms').doc(code).collection('chat').orderBy('time','asc').onSnapshot(snap => {
                const box = document.getElementById('debate-chat-box');
                box.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    box.innerHTML += `<div class="msg"><b>${m.name}</b>${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // GAME FLOW
        async function startGame() {
            const pSnap = await db.collection('rooms').doc(currentRoomId).collection('players').get();
            const ids = pSnap.docs.map(d => d.id);
            if(ids.length < 3) return alert("Mínimo 3 jugadores");
            
            const item = bibliaData[Math.floor(Math.random()*bibliaData.length)];
            const impostor = ids[Math.floor(Math.random()*ids.length)];
            
            await db.collection('rooms').doc(currentRoomId).update({
                status: 'playing', impostorId: impostor, word: item.w, quote: item.q,
                order: ids.sort(() => Math.random()-0.5), turn: 0,
                endTime: Date.now() + 120000
            });
        }

        function setupGame(data) {
            const isImp = data.impostorId === currentUser.uid;
            document.getElementById('role-name').innerText = isImp ? "ERES EL FALSO PROFETA" : "ERES UN DISCÍPULO";
            document.getElementById('game-word').innerText = isImp ? "¡ESCÓNDETE!" : data.word;
            document.getElementById('game-quote').innerText = isImp ? "Miente para que no te descubran." : data.quote;
            showScreen('screen-reveal');
        }

        function goToDebate() {
            if(isHost) db.collection('rooms').doc(currentRoomId).update({ status: 'debate' });
            else showScreen('screen-debate');
        }

        function handleDebate(data) {
            showScreen('screen-debate');
            const turnId = data.order[data.turn];
            document.getElementById('clue-input-area').style.display = (turnId === currentUser.uid) ? 'block' : 'none';
            document.getElementById('turn-info').innerText = (turnId === currentUser.uid) ? "¡ES TU TURNO!" : "ESPERA SEÑALES...";
            
            if(!timerInt) {
                timerInt = setInterval(() => {
                    const diff = data.endTime - Date.now();
                    if(diff <= 0) {
                        clearInterval(timerInt); timerInt = null;
                        if(isHost) db.collection('rooms').doc(currentRoomId).update({ status: 'voting' });
                    } else {
                        const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
                        document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
                    }
                }, 1000);
            }
        }

        async function sendClue() {
            const val = document.getElementById('clue-input').value;
            if(!val) return;
            await db.collection('rooms').doc(currentRoomId).collection('chat').add({ name: currentUser.name, text: val.toUpperCase(), time: Date.now() });
            document.getElementById('clue-input').value = "";
            const doc = await db.collection('rooms').doc(currentRoomId).get();
            const next = (doc.data().turn + 1) % doc.data().order.length;
            db.collection('rooms').doc(currentRoomId).update({ turn: next });
        }

        async function setupVoting() {
            const pSnap = await db.collection('rooms').doc(currentRoomId).collection('players').get();
            let h = "";
            pSnap.forEach(p => {
                if(p.id !== currentUser.uid) h += `<button class="btn btn-gold" onclick="voteFor('${p.id}')">${p.data().name}</button>`;
            });
            document.getElementById('vote-grid').innerHTML = h;
            showScreen('screen-vote');
        }

        async function voteFor(id) {
            document.getElementById('vote-grid').style.pointerEvents = 'none';
            await db.collection('rooms').doc(currentRoomId).collection('players').doc(currentUser.uid).update({ vote: id });
            if(isHost) checkVotes();
        }

        async function checkVotes() {
            const pSnap = await db.collection('rooms').doc(currentRoomId).collection('players').get();
            const allVoted = pSnap.docs.every(d => d.data().vote);
            if(allVoted) {
                const rData = (await db.collection('rooms').doc(currentRoomId).get()).data();
                let votes = {}, summary = "";
                pSnap.forEach(p => {
                    const v = p.data().vote;
                    const targetName = pSnap.docs.find(x => x.id === v).data().name;
                    summary += `<div>${p.data().name} votó a ${targetName}</div>`;
                    votes[v] = (votes[v] || 0) + 1;
                });
                const expelledId = Object.keys(votes).reduce((a, b) => votes[a] > votes[b] ? a : b);
                const win = expelledId === rData.impostorId ? 'DISCÍPULOS' : 'FALSO PROFETA';
                const impName = pSnap.docs.find(x => x.id === rData.impostorId).data().name;
                db.collection('rooms').doc(currentRoomId).update({ status: 'result', winner: win, summary, impName });
            }
        }

        function showResult(data) {
            document.getElementById('res-title').innerText = data.winner === 'DISCÍPULOS' ? "¡LOGRARON EXPULSARLO!" : "¡EL PROFETA ESCAPÓ!";
            document.getElementById('res-name').innerText = data.impName;
            document.getElementById('res-summary').innerHTML = data.summary;
            if(isHost) {
                document.getElementById('host-controls').style.display = 'block';
                document.getElementById('guest-controls').style.display = 'none';
            } else {
                document.getElementById('host-controls').style.display = 'none';
                document.getElementById('guest-controls').style.display = 'block';
            }
            showScreen('screen-result');
        }

        async function resetGame() {
            const chatSnap = await db.collection('rooms').doc(currentRoomId).collection('chat').get();
            chatSnap.forEach(d => d.ref.delete());
            const pSnap = await db.collection('rooms').doc(currentRoomId).collection('players').get();
            pSnap.forEach(d => d.ref.update({ vote: firebase.firestore.FieldValue.delete() }));
            db.collection('rooms').doc(currentRoomId).update({ status: 'waiting' });
            showScreen('screen-lobby-host');
        }

        async function deleteRoom() {
            if(confirm("¿Cerrar sala?")) {
                await db.collection('rooms').doc(currentRoomId).delete();
                location.reload();
            }
        }

        async function leaveRoom() {
            await db.collection('rooms').doc(currentRoomId).collection('players').doc(currentUser.uid).delete();
            location.reload();
        }
    </script>
</body>
</html>
